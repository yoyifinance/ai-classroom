<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YoYi AI 教室</title>
<meta name="description" content="給忙碌上班族的懶人 AI 教學：照著做、複製貼上，就能讓 AI 幫你做事。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 版面：課程目錄。一欄清單，已上線的課可點，未上線的淡化。 */
:root{
  --bg:#F3F5F4; --paper:#FFFFFF; --ink:#13262B; --muted:#5B6B6F; --line:#D6DDDB;
  --teal:#1F5C63; --seal:#B8402B;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#0E1719;--paper:#152225;--ink:#E6EEEC;--muted:#9AAAAD;--line:#2A3B3F;--teal:#7FC4C9;--seal:#E8775F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;padding-block:48px 80px;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--seal);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:1.2;margin:0}
.lead{font-size:18px;margin:0;max-width:56ch}
.list{display:flex;flex-direction:column;gap:12px}
.course{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;text-decoration:none;color:inherit}
a.course:hover,a.course:focus-visible{border-color:var(--seal);outline:none}
.no{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--seal);line-height:1}
.course h2{margin:0;font-size:19px}
.course p{margin:2px 0 0;color:var(--muted);font-size:15px}
.soon{opacity:.55}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
footer{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <div class="eyebrow">YoYi AI 教室</div>
    <h1>懶人也能用 AI</h1>
    <p class="lead">不用會寫程式，照著做、複製貼上，就能讓 AI 幫你整理客戶、剪影片、做網站。</p>
  </header>
  <div class="list">
    <a class="course" href="crm/">
      <span class="no">01</span>
      <span><h2>AI 客戶紀錄建檔說明書<span class="tag">懶人版</span></h2>
      <p>保險、房仲、汽車業務都適用。把散在各處的客戶資料整理成一份好看的試算表，之後講一句話就更新。</p></span>
    </a>
    <div class="course soon"><span class="no">02</span><span><h2>AI 影片剪輯</h2><p>準備中</p></span></div>
    <div class="course soon"><span class="no">03</span><span><h2>用 AI 做自己的官方網站</h2><p>準備中</p></span></div>
  </div>
  <footer>YoYi AI 教室・用 AI 整理客戶資料前，請先了解公司對個資的規定。</footer>
</div>
</body>
</html>
